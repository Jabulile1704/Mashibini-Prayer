version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: ['role:devops', 'type:chore']

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    labels: ['role:dev', 'type:chore']
    open-pull-requests-limit: 5
