name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos

  test:
    name: Unit and widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test with coverage
        run: flutter test --coverage --reporter expanded
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  rules:
    name: Security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Firestore emulator is a Java program. This is also why the rules
      # tests do not run on the author's Mac, which has no JDK — see the day 9
      # log.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/rules/package-lock.json

      # The rules tests hand-built every document they checked, which is how
      # they passed for twenty-five days while the rules asked for a
      # `memberUids` the app never wrote. This emits the document the app's
      # own serialiser produces, and the suite asserts the rules accept it.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Emit the document the app actually writes
        run: dart run tool/emit_rules_fixture.dart

      - name: Install
        working-directory: test/rules
        run: npm ci

      # The SAS Function had no tests at all, and shipped an authorisation
      # decision that authorised nothing: it verified the caller's token and
      # then signed for whatever blob name the query string asked for. These
      # run here rather than in a job of their own because this job is the
      # one that means "security", and a new required check would have to be
      # added to branch protection by hand before it could block anything.
      #
      # No emulator and no network: `authz.ts` has no imports, which is the
      # reason it is a separate file.
      - name: Install the Function
        working-directory: azure/sas-function
        run: npm ci

      - name: Run the Function's authorisation tests
        working-directory: azure/sas-function
        run: npm test

      - name: Run the rules against the emulator
        # A project id beginning with "demo-" keeps the emulator offline: it
        # never looks for a real Firebase project, which is what lets these
        # tests pass before one exists.
        run: |
          npx --yes firebase-tools@14 emulators:exec \
            --only firestore \
            --project demo-mashibini \
            "cd test/rules && npm test"

  build-android:
    name: Android build
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The job always runs and always reports, because it is a required
      # check — skipping it with `paths-ignore` would leave the check never
      # reporting and the pull request blocked forever. What is skipped is
      # the expensive part, not the job.
      - name: Is there anything here that could break an Android build?
        id: scope
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request — building."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "$CHANGED"
          # Anything outside docs/ can affect the build. Deliberately
          # generous: a filter that is too narrow stops guarding real
          # changes, which is a far worse failure than a build that did not
          # need to run.
          if printf '%s\n' "$CHANGED" | grep -qvE '^(docs/|\.github/ISSUE_TEMPLATE/|README\.md$|CHANGELOG\.md$)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Documentation only — nothing here can break an Android build."
          fi

      - uses: actions/setup-java@v4
        if: steps.scope.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '17'
          # A warm cache is not re-fetched, which is the cheapest way to
          # stop hammering Maven Central at all (#30).
          cache: gradle
      - uses: subosito/flutter-action@v2
        if: steps.scope.outputs.needed == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        if: steps.scope.outputs.needed == 'true'

      # Flutter's own retry waits 100ms, which against a rate limiter is not
      # a back-off — it is the same request again. These wait 30s then 90s,
      # which is long enough for a 429 window to pass (#30).
      - name: Build debug APK
        if: steps.scope.outputs.needed == 'true'
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              wait=$((attempt * 60 - 30))
              echo "::warning::Build attempt $attempt failed. Waiting ${wait}s before retrying."
              sleep "$wait"
            fi
          done
          echo "::error::Android build failed three times. This is not a rate limit."
          exit 1

      - name: Upload APK
        if: steps.scope.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
