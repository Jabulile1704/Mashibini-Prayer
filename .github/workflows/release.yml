name: Release

# Fires on a version tag, never on a branch. The tag is the decision to
# release; everything here is consequence, so there is no way to ship
# something that was not tagged and no way to tag something without shipping.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  verify:
    name: The tag and the app agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      build: ${{ steps.read.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version out of pubspec.yaml
        id: read
        run: |
          FULL=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          VERSION=${FULL%%+*}
          BUILD=${FULL##*+}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "pubspec says $VERSION+$BUILD"

      # A tag that disagrees with pubspec.yaml ships a build whose own
      # "Version" line contradicts the release it came from. Caught here
      # rather than discovered on somebody's phone.
      - name: It matches the tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          if [ "$TAG" != "${{ steps.read.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version ${{ steps.read.outputs.version }}"
            exit 1
          fi

      - name: The changelog has an entry for it
        run: |
          if ! grep -q "^## \[${{ steps.read.outputs.version }}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${{ steps.read.outputs.version }}]' section"
            exit 1
          fi

  build:
    name: Android build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Without this the Android Gradle Plugin silently generates a fresh
      # debug keystore and signs with that — a different key every run, which
      # Android refuses to install over the previous release (issue #67).
      # Failing loudly beats publishing something nobody can update to.
      - name: The signing key is present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see docs/RELEASING.md"
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload-keystore.p12"

      - name: Build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Two builds, because they produce different things and the family
          # needs both. `--split-per-abi` writes one APK per processor
          # architecture; the plain build writes the universal one that
          # carries all of them, which is why it is around three times the
          # size.
          #
          # Split first and universal second, so that if the second run ever
          # cleans the output directory the failure is a missing file at the
          # check below rather than a silently universal "arm64" APK.
          flutter build apk --release --split-per-abi
          flutter build apk --release
          ls -l build/app/outputs/flutter-apk/

      # The guard on #67, which for four releases guarded nothing (#103).
      #
      # It used `keytool -printcert -jarfile`, which reads only the v1 JAR
      # signature. Flutter's release APKs are v2/v3 and carry no v1 block, so
      # keytool found nothing, grep matched nothing, and `|| true` turned the
      # failure into a pass. It reported success without reading a key.
      #
      # This reads the v2/v3 signing block and **fails** on anything other
      # than the fingerprint in android/release-key.sha256 — including
      # finding no certificate at all, which was the case that used to pass.
      # The fingerprint is a public value; the key is not.
      #
      # **Every APK that gets published**, not just the one that used to be
      # the only one. An unchecked artefact on a release page is #103 again
      # in a different costume: the check would still pass, and it would no
      # longer be checking what the family installs.
      - name: Every APK we publish is signed with the key every release used
        run: |
          set -eu
          OUT=build/app/outputs/flutter-apk
          EXPECT="$(cat android/release-key.sha256)"
          for apk in "$OUT/app-arm64-v8a-release.apk" "$OUT/app-release.apk"; do
            if [ ! -f "$apk" ]; then
              echo "::error::$apk was not built. Refusing to publish a"\
                   "release that is missing one of its APKs."
              exit 1
            fi
            echo "== $apk"
            dart run tool/apk_signing_key.dart "$apk" --expect "$EXPECT"
          done

      # The name without a suffix is the one almost everybody needs.
      #
      # arm64-v8a has been all but universal on Android phones since 2017,
      # and Assumption 1 in the requirements already says every member has a
      # phone capable of running a current Flutter app. The universal build
      # stays as a named fallback, because the failure it guards against —
      # "App not installed", with no explanation — is one a family member
      # cannot debug, and a larger download is a much smaller problem.
      - name: Name them after the release
        run: |
          set -eu
          OUT=build/app/outputs/flutter-apk
          V="${{ needs.verify.outputs.version }}"
          mv "$OUT/app-arm64-v8a-release.apk" "mashibini-prayer-$V.apk"
          mv "$OUT/app-release.apk" "mashibini-prayer-$V-any-phone.apk"
          ls -lh mashibini-prayer-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mashibini-prayer-*.apk

  publish:
    name: GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk

      # The notes are the changelog section, not a generated commit dump.
      # Somebody reading a release wants to know what changed for them.
      - name: Take the notes from the changelog
        run: |
          awk -v v="${{ needs.verify.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { show = 1; next }
            show && /^## \[/ { exit }
            show { print }
          ' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "---" >> notes.md
          echo "" >> notes.md
          echo "**Which file do I want?**" >> notes.md
          echo "" >> notes.md
          echo "Take \`mashibini-prayer-${{ needs.verify.outputs.version }}.apk\`. It is the right one for virtually every Android phone." >> notes.md
          echo "" >> notes.md
          echo "If your phone says *App not installed*, take the \`-any-phone\` one instead. It is larger because it carries every kind of processor, and it works everywhere." >> notes.md
          echo "" >> notes.md
          echo "Built from \`${GITHUB_SHA}\` · build ${{ needs.verify.outputs.build }}" >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.verify.outputs.version }}
          body_path: notes.md
          files: mashibini-prayer-*.apk
          fail_on_unmatched_files: true
