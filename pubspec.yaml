name: mashibini_prayer
description: "Holds the Mashibini family prayer rota: whose week it is to lead family prayer."
publish_to: 'none'
version: 1.4.0+8

environment:
  sdk: ^3.13.3

dependencies:
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  # Used by tool/apk_signing_key.dart to fingerprint the certificate an APK
  # was signed with. A dev dependency because it never ships in the app.
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    # The daily verses. Bundled so they read with no connection (R3.1), and
    # because a public-domain translation never changes under us.
    - assets/verses.json
