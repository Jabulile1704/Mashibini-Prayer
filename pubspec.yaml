name: mashibini_prayer
description: "Holds the Mashibini family prayer rota: whose week it is to lead family prayer."
publish_to: 'none'
version: 2.1.0+11

environment:
  sdk: ^3.13.3

dependencies:
  # Choosing and playing a recording the family already has (#124). The
  # file is copied into the app's own directory and its path is kept out of
  # the shared document — see `AudioLibraryRepository`.
  audioplayers: ^6.5.1
  file_selector: ^1.0.3
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.1.0
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  # Picking a family photograph. The image is copied into the app's own
  # directory and never uploaded, so ADR-010's third clause is untouched —
  # see Member.photoPath.
  google_sign_in: ^7.2.0
  image_picker: ^1.2.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  # Used by tool/apk_signing_key.dart to fingerprint the certificate an APK
  # was signed with. A dev dependency because it never ships in the app.
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    # The daily sayings. Bundled so they read with no connection (R3.1), and
    # because thirty traditional proverbs never change under us (ADR-025).
    - assets/sayings.json
